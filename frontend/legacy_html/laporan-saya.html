<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Laporan Saya - SiagaWarga</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="app-layout">

  <!-- Sidebar Navigasi Desktop (Figma Node 4:1110) -->
  <aside class="app-sidebar">
    <div>
      <div class="sidebar-header">
        <a href="beranda.html" class="sidebar-brand">
          <img src="assets/logo-siagawarga.png" alt="SiagaWarga">
          <span class="sidebar-brand-name">SiagaWarga</span>
        </a>
      </div>

      <ul class="sidebar-menu">
        <li class="sidebar-menu-item">
          <a href="beranda.html">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
              <polyline points="9 22 9 12 15 12 15 22"></polyline>
            </svg>
            <span>Beranda</span>
          </a>
        </li>
        <li class="sidebar-menu-item">
          <a href="laporan-saya.html" class="active">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
              <polyline points="14 2 14 8 20 8"></polyline>
              <line x1="16" y1="13" x2="8" y2="13"></line>
              <line x1="16" y1="17" x2="8" y2="17"></line>
            </svg>
            <span>Laporan</span>
          </a>
        </li>
        <li class="sidebar-menu-item">
          <a href="peta.html">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <polygon points="1 6 1 22 8 18 16 22 23 18 23 2 16 6 8 2 1 6"></polygon>
              <line x1="8" y1="2" x2="8" y2="18"></line>
              <line x1="16" y1="6" x2="16" y2="22"></line>
            </svg>
            <span>Peta laporan</span>
          </a>
        </li>
      </ul>
    </div>

    <div class="sidebar-footer">
      <button onclick="handleLogout()" class="sidebar-logout-btn">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
          <polyline points="16 17 21 12 16 7"></polyline>
          <line x1="21" y1="12" x2="9" y2="12"></line>
        </svg>
        <span>Keluar</span>
      </button>
    </div>
  </aside>

  <!-- Main Workspace Area -->
  <main class="app-main">
    <!-- Topbar (Figma Node 4:1142) -->
    <header class="app-topbar">
      <div class="topbar-role-label">Layanan Warga</div>
      <div class="topbar-actions">
        <button class="topbar-bell-btn" title="Notifikasi">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
            <path d="M12 22c1.1 0 2-.9 2-2h-4c0 1.1.9 2 2 2zm6-6v-5c0-3.07-1.63-5.64-4.5-6.32V4c0-.83-.67-1.5-1.5-1.5s-1.5.67-1.5 1.5v.68C7.64 5.36 6 7.92 6 11v5l-2 2v1h16v-1l-2-2zm-2 1H8v-6c0-2.48 1.51-4.5 4-4.5s4 2.02 4 4.5v6z"/>
          </svg>
        </button>
        <a href="profil.html" style="text-decoration: none;">
          <div class="user-avatar-circle" id="userAvatar">AM</div>
        </a>
      </div>
    </header>

    <!-- Page Body (Figma Node 4:797) -->
    <div class="app-content">
      <div style="display: flex; justify-content: space-between; align-items: flex-end; margin-bottom: 24px;">
        <section class="greeting-section" style="margin-bottom: 0;">
          <div class="greeting-location" id="userSubTitle">Akun Warga</div>
          <h1 class="greeting-title">Laporan saya</h1>
          <p style="font-size: 14px; color: #64748b; margin-top: 4px;">Pantau setiap laporan dan tindak lanjutnya.</p>
        </section>
        <a href="buat-laporan.html" class="btn-teal-action" style="padding: 10px 20px;">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <line x1="12" y1="5" x2="12" y2="19"></line>
            <line x1="5" y1="12" x2="19" y2="12"></line>
          </svg>
          <span>Buat laporan baru</span>
        </a>
      </div>

      <!-- Search & Filters Box -->
      <div class="filter-card-bar">
        <label class="field-label" style="font-size: 12px; margin-bottom: 6px;">Cari laporan</label>
        <div class="search-input-box">
          <input type="text" id="searchInput" oninput="applyFilters()" class="search-input-field" placeholder="Judul atau nomor laporan...">
          <svg class="search-field-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="11" cy="11" r="8"></circle>
            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
          </svg>
        </div>

        <div class="tab-filter-row">
          <button type="button" class="tab-chip active" id="chipAll" onclick="setTab('all')">Semua (<span id="countAll">0</span>)</button>
          <button type="button" class="tab-chip" id="chipAktif" onclick="setTab('aktif')">Aktif (<span id="countAktif">0</span>)</button>
          <button type="button" class="tab-chip" id="chipSelesai" onclick="setTab('selesai')">Selesai (<span id="countSelesai">0</span>)</button>
        </div>
      </div>

      <!-- Report Counter & Time -->
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; font-size: 13px; color: #64748b;">
        <span id="labelTotalDisplayed" style="font-weight: 700; color: #0f172a;">Memuat laporan...</span>
        <span id="currentDateFormatted">12 Okt 2026 • 09.30 WIB</span>
      </div>

      <!-- Table Card (Figma Node 4:812) -->
      <div class="report-table-box">
        <div class="report-table-header">
          <div>Laporan</div>
          <div>Prioritas</div>
          <div>Status</div>
          <div>Waktu & Kategori</div>
          <div></div>
        </div>

        <div id="reportsTableList">
          <div style="padding: 32px; text-align: center; color: #94a3b8; font-size: 14px;">Memuat data laporan langsung dari database...</div>
        </div>
      </div>
    </div>
  </main>

  <script src="js/config.js"></script>
  <script>
    const API_BASE = window.API_BASE || "http://127.0.0.1:8000/api/v1";
    let allReports = [];
    let currentFilterTab = "all";

    function handleLogout() {
      localStorage.removeItem("siagawarga_token");
      localStorage.removeItem("siagawarga_user");
      window.location.href = "login.html";
    }

    async function loadReports() {
      try {
        const token = localStorage.getItem("siagawarga_token");
        const headers = token ? { "Authorization": `Bearer ${token}` } : {};
        
        let res = null;
        if (token) {
          res = await fetch(`${API_BASE}/laporan/saya`, { headers });
        }

        let list = [];
        if (res && res.ok) {
          list = await res.json();
        }

        // Jika belum ada laporan pribadi atau token tidak ada, muat data umum wilayah
        if (!Array.isArray(list) || list.length === 0) {
          const publicRes = await fetch(`${API_BASE}/spasial/prioritas?limit=50`);
          if (publicRes.ok) {
            list = await publicRes.json();
          }
        }

        allReports = Array.isArray(list) ? list : [];
        renderData();
      } catch (e) {
        console.warn("Could not load reports:", e);
      }
    }

    function setTab(tab) {
      currentFilterTab = tab;
      document.getElementById("chipAll").classList.toggle("active", tab === "all");
      document.getElementById("chipAktif").classList.toggle("active", tab === "aktif");
      document.getElementById("chipSelesai").classList.toggle("active", tab === "selesai");
      renderData();
    }

    function applyFilters() {
      renderData();
    }

    function renderData() {
      const q = (document.getElementById("searchInput").value || "").toLowerCase().trim();
      let filtered = allReports.filter(r => {
        const title = (r.judul || "").toLowerCase();
        const shortId = typeof r.id === "string" ? r.id.substring(0, 8).toLowerCase() : String(r.id).toLowerCase();
        const code = `SW-${shortId}`;
        const loc = (r.alamat_lokasi || r.lokasi_deskripsi || "").toLowerCase();
        return title.includes(q) || code.includes(q) || loc.includes(q);
      });

      const totalCount = allReports.length;
      const aktifCount = allReports.filter(r => {
        const s = (r.status || "").toUpperCase();
        return s !== "SELESAI" && s !== "DITOLAK";
      }).length;
      const selesaiCount = allReports.filter(r => (r.status || "").toUpperCase() === "SELESAI").length;

      document.getElementById("countAll").textContent = totalCount;
      document.getElementById("countAktif").textContent = aktifCount;
      document.getElementById("countSelesai").textContent = selesaiCount;

      if (currentFilterTab === "aktif") {
        filtered = filtered.filter(r => {
          const s = (r.status || "").toUpperCase();
          return s !== "SELESAI" && s !== "DITOLAK";
        });
      } else if (currentFilterTab === "selesai") {
        filtered = filtered.filter(r => (r.status || "").toUpperCase() === "SELESAI");
      }

      document.getElementById("labelTotalDisplayed").textContent = `${filtered.length} laporan ditampilkan`;

      const container = document.getElementById("reportsTableList");
      if (filtered.length === 0) {
        container.innerHTML = `<div style="padding: 40px; text-align: center; color: #94a3b8; font-size: 14px;">Belum ada laporan yang sesuai kriteria pencarian.</div>`;
        return;
      }

      container.innerHTML = "";
      filtered.forEach(r => {
        const shortId = typeof r.id === "string" ? r.id.substring(0, 8).toUpperCase() : String(r.id);
        const code = `SW-${shortId}`;
        
        const prioCat = (r.kategori_prioritas || r.severity || "").toUpperCase();
        const isUrgent = prioCat === "P1" || prioCat === "TINGGI" || prioCat === "HIGH" || prioCat === "URGENT";
        const prioClass = isUrgent ? "badge-urgent" : "badge-low";
        const prioText = isUrgent ? "Urgent (P1)" : (prioCat || "Normal");

        const st = (r.status || "DIKIRIM").toUpperCase();
        const isSelesai = st === "SELESAI";
        const isDitangani = st === "DIPROSES" || st === "DITANGANI";
        const statusClass = isSelesai ? "badge-in-progress" : (isDitangani ? "badge-in-progress" : "badge-waiting");
        const statusText = isSelesai ? "Selesai" : (isDitangani ? "Ditangani" : (st === "DIKIRIM" ? "Menunggu verifikasi" : "Menunggu"));

        const rawDate = r.dibuat_pada || r.created_at;
        const dateStr = rawDate ? new Date(rawDate).toLocaleDateString('id-ID', { day: 'numeric', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit' }) : "Baru saja";
        const namaKategori = r.kategori ? (typeof r.kategori === "object" ? r.kategori.nama : r.kategori) : "Umum";
        const alamat = r.alamat_lokasi || r.lokasi_deskripsi || "Lokasi Wilayah";

        const row = document.createElement("a");
        row.href = `detail-laporan.html?id=${r.id}`;
        row.className = "report-table-row";
        row.innerHTML = `
          <div>
            <div style="font-size: 12px; font-weight: 600; color: #64748b; margin-bottom: 4px;">${code}</div>
            <h4 style="font-size: 15px; font-weight: 700; color: #0f172a; margin-bottom: 4px;">${r.judul}</h4>
            <div style="font-size: 13px; color: #64748b;">${alamat}</div>
          </div>
          <div>
            <span class="pill-badge ${prioClass}">
              <span class="pill-dot"></span>
              <span>${prioText}</span>
            </span>
          </div>
          <div>
            <span class="pill-badge ${statusClass}">
              <span class="pill-dot"></span>
              <span>${statusText}</span>
            </span>
          </div>
          <div>
            <div style="font-size: 13px; font-weight: 600; color: #0f172a;">${dateStr}</div>
            <div style="font-size: 12px; color: #64748b;">${namaKategori}</div>
          </div>
          <div>
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="9 18 15 12 9 6"></polyline>
            </svg>
          </div>
        `;
        container.appendChild(row);
      });
    }

    window.addEventListener("DOMContentLoaded", () => {
      const token = localStorage.getItem("siagawarga_token");
      if (token) {
        fetch(`${API_BASE}/auth/me`, { headers: { "Authorization": `Bearer ${token}` } })
          .then(r => r.json())
          .then(u => {
            if (u.nama) {
              document.getElementById("userSubTitle").textContent = `Akun ${u.nama}`;
              const parts = u.nama.trim().split(" ");
              const initials = parts.length > 1 ? (parts[0][0] + parts[1][0]).toUpperCase() : parts[0][0].toUpperCase();
              document.getElementById("userAvatar").textContent = initials;
            }
          })
          .catch(() => {});
      }
      loadReports();
    });
  </script>
</body>
</html>
